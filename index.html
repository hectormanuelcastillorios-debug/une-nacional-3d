<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Red de Inteligencia</title>
    
    <script src="https://unpkg.com/3d-force-graph"></script>

    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; border-radius: 0 5px 5px 0;
        }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: 800; font-size: 18px; letter-spacing: 1px;">ESTRUCTURA UNE</div>
        <div id="status" class="stats">INICIALIZANDO...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        // Función ultra-simple para generar etiquetas de texto
        function makeTextSprite(message, color) {
            const canvas = document.createElement('canvas');
            const size = 120; // Resolución del texto
            canvas.width = 512;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            
            context.fillStyle = 'rgba(0,0,0,0.7)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.strokeStyle = color;
            context.lineWidth = 10;
            context.strokeRect(0, 0, canvas.width, canvas.height);
            
            context.font = `bold 80px Arial`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = '#ffffff';
            context.fillText(message, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(30, 8, 1); // Tamaño del nombre en el espacio
            return sprite;
        }

        // Inicialización directa
        const elem = document.getElementById('3d-graph');
        const Graph = ForceGraph3D()(elem)
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            .linkWidth(2)
            .linkOpacity(0.3)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            
            // --- IMPACTO: NOMBRES SIEMPRE VISIBLES ---
            .nodeThreeObject(node => {
                const color = node.color || '#66CC33';
                const sprite = makeTextSprite(node.name, color);
                sprite.position.y = 12; // Posición arriba de la esfera
                return sprite;
            })
            .nodeThreeObjectExtend(true)

            // --- RED COMPACTA (Distancia reducida a la mitad) ---
            .d3Force('charge').strength(-150)
            .d3Force('link').distance(40) // Muy cerca para máximo impacto visual
            
            .showNavInfo(false);

        // Controles de Cámara
        Graph.controls().enableZoom = true;
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.5;

        // Detener rotación al tocar
        window.addEventListener('mousedown', () => { Graph.controls().autoRotate = false; });

        // Carga de Datos
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = `LÍDERES: ${data.nodes.length} | ESTADO: ONLINE`;
                Graph.graphData(data);
                
                // Zoom inicial ajustado a la red compacta
                setTimeout(() => Graph.zoomToFit(600, 100), 500);
            })
            .catch(err => {
                document.getElementById('status').innerText = "ERROR CARGANDO DATOS";
                console.error(err);
            });
    </script>
</body>
</html>
