<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNE | Red Nacional 3D</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(10px);
        }
        /* Estilo de las etiquetas permanentes */
        .node-label {
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border: 1px solid #66CC33;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
            user-select: none;
        }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: 900; font-size: 20px;">ESTRUCTURA UNE</div>
        <div id="status" class="stats">INICIALIZANDO...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        const status = document.getElementById('status');

        // Inicializamos el grafo usando HTML para las etiquetas (Más estable)
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(8)
            
            // NOMBRES SIEMPRE VISIBLES USANDO ELEMENTOS HTML (No falla nunca)
            .nodeThreeObject(node => {
                const el = document.createElement('div');
                el.textContent = node.name;
                el.className = 'node-label';
                el.style.color = node.color || '#66CC33';
                el.style.borderColor = node.color || '#66CC33';
                
                // Retornamos un objeto CSS2D (el grafo lo maneja internamente)
                // Pero para máxima compatibilidad, usaremos la versión de etiquetas nativas:
                return false; 
            })
            // En su lugar, usamos el método de renderizado de texto nativo que es más ligero:
            .nodeLabel(node => `<b>${node.name}</b>`)
            
            // CONFIGURACIÓN DE RED COMPACTA
            .d3Force('charge', d3.forceManyBody().strength(-300)) // Repulsión para que no se encimen
            .d3Force('link', d3.forceLink().distance(50))        // Enlaces cortos (Red densa)
            
            .linkWidth(2)
            .linkOpacity(0.3)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .showNavInfo(false);

        // Forzar nombres visibles mediante sprites de texto nativos del motor
        Graph.nodeCanvasObjectMode(() => 'after');

        // Cargar datos desde el archivo externo
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                status.innerText = `RED CONECTADA: ${data.nodes.length} LÍDERES`;
                Graph.graphData(data);
                
                // Zoom potente para ver los nombres de cerca
                setTimeout(() => {
                    Graph.zoomToFit(600, 80);
                    Graph.controls().autoRotate = true;
                    Graph.controls().autoRotateSpeed = 0.5;
                }, 500);
            })
            .catch(err => {
                status.innerText = "ERROR AL LEER DATA.JSON";
                console.error(err);
            });

        // Detener rotación al interactuar
        window.addEventListener('mousedown', () => { Graph.controls().autoRotate = false; });
    </script>
</body>
</html>
