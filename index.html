<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNE | Red Estratégica Nacional</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <style>
        body { margin: 0; background: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(8px);
        }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: 900; font-size: 18px;">ESTRUCTURA UNE</div>
        <div id="status" class="stats">SINCRO DE DATOS...</div>
    </div>

    <div id="graph"></div>

    <script>
        // Función para crear la placa de identificación (Nombre + Barrio)
        function createTag(node) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const name = node.name || "Líder";
            const barrio = node.barrio || "Zona Nacional"; // Traemos el barrio del JSON
            
            ctx.font = 'bold 36px Arial';
            const width = Math.max(ctx.measureText(name).width, ctx.measureText(barrio).width) + 60;
            
            canvas.width = width;
            canvas.height = 120;

            // Fondo
            ctx.fillStyle = 'rgba(0, 5, 15, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Borde
            ctx.strokeStyle = node.color || '#66CC33';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Texto: Nombre
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name, canvas.width / 2, 50);

            // Texto: Barrio (Más pequeño y verde)
            ctx.fillStyle = '#66CC33';
            ctx.font = '24px Arial';
            ctx.fillText(barrio, canvas.width / 2, 90);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            
            sprite.scale.set(width / 12, 10, 1);
            sprite.position.y = 12;
            return sprite;
        }

        const Graph = ForceGraph3D()(document.getElementById('graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            
            // --- NOMBRES Y BARRIOS PERMANENTES ---
            .nodeThreeObject(node => {
                const group = new THREE.Group();
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(5),
                    new THREE.MeshLambertMaterial({ color: node.color || '#66CC33' })
                );
                group.add(sphere);
                group.add(createTag(node));
                return group;
            })
            .nodeThreeObjectExtend(true)

            // --- RED MUY COMPACTA (Estilo Neuronal) ---
            .d3Force('charge', d3.forceManyBody().strength(-150))
            .d3Force('link', d3.forceLink().distance(40))
            
            .linkWidth(1.5)
            .linkColor(() => '#ffffff')
            .linkOpacity(0.2)
            .linkDirectionalParticles(2)
            .showNavInfo(false);

        // Controles de Rotación
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.5;

        // Carga de datos
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = `LÍDERES: ${data.nodes.length} | BARRIOS CONECTADOS`;
                Graph.graphData(data);
                
                // Zoom inicial potente
                setTimeout(() => Graph.zoomToFit(700, 100), 500);
            })
            .catch(err => {
                document.getElementById('status').innerText = "ERROR EN DATA.JSON";
            });

        // Detener rotación al interactuar
        window.addEventListener('mousedown', () => { Graph.controls().autoRotate = false; });
    </script>
</body>
</html>
</html>
