<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNE | Red Estratégica</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <style>
        body { margin: 0; background: #00050a; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10; color: white;
            background: rgba(0, 10, 20, 0.9); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 20px; font-weight: 900;">ESTRUCTURA UNE</div>
        <div id="status" style="font-size: 11px; color: #66CC33;">CONECTANDO...</div>
    </div>
    <div id="graph"></div>

    <script>
        // Iniciar inmediatamente
        const Graph = ForceGraph3D()(document.getElementById('graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            
            // --- NOMBRES SIEMPRE VISIBLES (MÉTODO SPRITE DIRECTO) ---
            .nodeThreeObject(node => {
                // Creamos un canvas para el nombre
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const label = node.name;
                ctx.font = 'bold 40px Arial';
                const width = ctx.measureText(label).width;
                canvas.width = width + 20;
                canvas.height = 50;

                // Fondo y texto
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, canvas.width/2, canvas.height/2);

                // Crear el Sprite
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.scale.set(canvas.width/10, 5, 1);
                sprite.position.y = 10; // Distancia sobre la esfera
                return sprite;
            })
            .nodeThreeObjectExtend(true) // Mantiene la esfera y pone el nombre encima
            
            // --- RED COMPACTA (DISTANCIA REDUCIDA) ---
            .d3Force('charge', d3.forceManyBody().strength(-150)) // Menos repulsión
            .d3Force('link', d3.forceLink().distance(45))       // Enlaces cortos = Red compacta
            
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .showNavInfo(false);

        // Controles de cámara
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.5;

        // Cargar datos
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = `LÍDERES: ${data.nodes.length} | ONLINE`;
                Graph.graphData(data);
                
                // Zoom para ver la red compacta de cerca
                setTimeout(() => Graph.zoomToFit(800, 100), 500);
            })
            .catch(err => {
                document.getElementById('status').innerText = "ERROR CARGANDO DATA.JSON";
            });

        // Detener rotación al interactuar
        window.addEventListener('mousedown', () => { Graph.controls().autoRotate = false; });
    </script>
</body>
</html>
