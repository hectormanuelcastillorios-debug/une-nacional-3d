<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Mapa Neuronal</title>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none;
        }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; font-size: 18px;">RED NACIONAL UNE</div>
        <div id="stats" class="stats">CARGANDO NODOS...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            
            // --- NOMBRES FLOTANTES (MÉTODO ULTRA-LIGERO) ---
            .nodeLabel(node => `Líder: ${node.name}`) // Tooltip de respaldo
            
            // --- ESTO PONE EL NOMBRE COMO OBJETO 3D SIN LIBRERÍAS EXTRAS ---
            .nodeCanvasObjectMode(() => 'after') 
            
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            
            // --- SEPARACIÓN DE NODOS (FUERZA BRUTA) ---
            .d3Force('charge', d3.forceManyBody().strength(-1000)) // Repulsión masiva
            .d3Force('link', d3.forceLink().distance(200)) // Cables más largos
            
            .showNavInfo(false);

        // Habilitar controles manuales
        Graph.controls().enableZoom = true;
        Graph.controls().enableRotate = true;

        // Carga de datos
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('stats').innerText = `LÍDERES: ${data.nodes.length} | ESTADO: ONLINE`;
                Graph.graphData(data);
                
                // Forzar que el mapa se centre y se aleje para que no se vea amontonado
                setTimeout(() => {
                    Graph.zoomToFit(1000, 300);
                }, 500);
            })
            .catch(err => {
                document.getElementById('stats').innerText = "ERROR EN DATA.JSON";
            });

        // ROTACIÓN AUTOMÁTICA QUE SÍ DEJA MOVER EL MOUSE
        // Usamos la función nativa del motor para no crear conflictos
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.5;

        // Si el usuario hace click, la rotación se detiene para dejarlo navegar
        window.addEventListener('mousedown', () => {
            Graph.controls().autoRotate = false;
        });
    </script>
</body>
</html>
