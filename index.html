<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Red Neuronal de Liderazgo</title>
    
    <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 20px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(8px); border-radius: 0 8px 8px 0;
        }

        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; letter-spacing: 1px; }
        
        #3d-graph { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-size: 22px; font-weight: 900; letter-spacing: 1px;">ESTRUCTURA UNE</div>
        <div id="status" class="stats">INICIALIZANDO CAPAS TÁCTICAS...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        // Función para crear la etiqueta de texto (Canvas nativo)
        function createLabel(text, color) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const fontSize = 28;
            ctx.font = `Bold ${fontSize}px Arial`;
            const textWidth = ctx.measureText(text).width;

            canvas.width = textWidth + 24;
            canvas.height = fontSize + 20;

            // Fondo negro semitransparente
            ctx.fillStyle = 'rgba(0, 5, 15, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Borde neón
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Texto blanco
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            
            // Ajuste de escala de la etiqueta
            sprite.scale.set(canvas.width / 10, canvas.height / 10, 1);
            return sprite;
        }

        // Inicialización una vez cargado el DOM
        window.addEventListener('load', () => {
            const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
                .backgroundColor('#00050a')
                .showNavInfo(false)
                
                // --- CONFIGURACIÓN DE NODOS ---
                .nodeThreeObject(node => {
                    const group = new THREE.Group();
                    
                    // 1. Esfera (El nodo)
                    const sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(6),
                        new THREE.MeshLambertMaterial({ color: node.color || '#66CC33' })
                    );
                    group.add(sphere);

                    // 2. Etiqueta (El nombre siempre visible)
                    const colorLabel = (node.color === '#ffffff') ? '#ffffff' : '#66CC33';
                    const label = createLabel(node.name, colorLabel);
                    label.position.set(0, 12, 0); // Lo coloca justo arriba
                    group.add(label);

                    return group;
                })
                
                // --- CONFIGURACIÓN DE ENLACES ---
                .linkWidth(2)
                .linkColor(() => '#ffffff')
                .linkOpacity(0.2)
                .linkDirectionalParticles(3)
                .linkDirectionalParticleSpeed(0.007)

                // --- AJUSTE DE DISTANCIA (COMPACTO Y DENSO) ---
                .d3Force('charge', d3.forceManyBody().strength(-200)) // Menos repulsión para que estén cerca
                .d3Force('link', d3.forceLink().distance(60));      // Distancia de cables reducida

            // Carga de datos
            fetch('./data.json')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status').innerText = `SISTEMA ONLINE: ${data.nodes.length} LÍDERES`;
                    Graph.graphData(data);
                    
                    // Zoom automático inicial
                    setTimeout(() => Graph.zoomToFit(800, 150), 600);
                })
                .catch(err => {
                    document.getElementById('status').innerText = "ERROR: ARCHIVO DATA.JSON NO ENCONTRADO";
                    console.error(err);
                });

            // Controles de Rotación y Zoom
            Graph.controls().autoRotate = true;
            Graph.controls().autoRotateSpeed = 0.5;

            // Detener rotación al interactuar para permitir zoom manual
            window.addEventListener('mousedown', () => { Graph.controls().autoRotate = false; });
        });
    </script>
</body>
</html>
