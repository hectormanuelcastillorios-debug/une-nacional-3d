<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Red Neuronal Nacional</title>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 10, 20, 0.8); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none;
        }
        .subtitle { font-size: 18px; font-weight: bold; }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="subtitle">ESTRUCTURA NACIONAL UNE</div>
        <div id="stats" class="stats">Sincronizando red...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .linkDirectionalParticleSpeed(0.005)
            
            // --- FIX DE NOMBRES: Usamos el método más ligero y nativo ---
            .nodeLabel(node => `Líder: ${node.name}`) 
            
            // --- DISTANCIA ENTRE NODOS: Forzamos la repulsión ---
            .d3Force('charge', d3.forceManyBody().strength(-1000)) // Repulsión muy fuerte
            .d3Force('link', d3.forceLink().distance(150)) // Enlaces más largos
            
            // Zoom automático inicial
            .showNavInfo(false);

        // Forzar Zoom con scroll
        Graph.controls().enableZoom = true;

        // Carga de datos con manejo de errores
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('stats').innerHTML = `LÍDERES: ${data.nodes.length} | CONEXIONES: ${data.links.length}`;
                Graph.graphData(data);
                
                // Esperar un segundo y ajustar cámara
                setTimeout(() => { Graph.zoomToFit(1000, 200); }, 500);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('stats').innerText = "ERROR AL CARGAR DATOS";
            });

        // Rotación suave que no bloquea la interacción
        let angle = 0;
        const distance = 1600;
        setInterval(() => {
            // Si el usuario no está tocando el mapa, rotar
            Graph.cameraPosition({
                x: distance * Math.sin(angle),
                z: distance * Math.cos(angle)
            });
            angle += Math.PI / 15000;
        }, 15);
    </script>
</body>
</html>
