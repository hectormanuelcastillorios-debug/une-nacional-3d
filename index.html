<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Inteligencia Táctica Nacional 3D</title>
    
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/three-spritetext"></script>
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { 
            margin: 0; 
            background-color: #00050a; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Panel de Control Estético */
        #ui-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 100;
            color: white;
            background: rgba(0, 15, 30, 0.8);
            padding: 20px;
            border-left: 4px solid #66CC33;
            backdrop-filter: blur(12px);
            pointer-events: none; /* Permite hacer clic a través del panel al mapa */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 0 4px 4px 0;
        }

        h1 {
            margin: 0;
            font-size: 12px;
            letter-spacing: 3px;
            color: #66CC33;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .subtitle {
            font-size: 22px;
            font-weight: 800;
            margin-top: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(102, 204, 51, 0.5);
        }

        .stats {
            margin-top: 15px;
            font-size: 11px;
            line-height: 1.6;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Instrucciones de navegación */
        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            text-align: right;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>Centro de Comando de Estructuras</h1>
        <div class="subtitle">RED NACIONAL UNE</div>
        <div id="stats" class="stats">Sincronizando con base de datos encriptada...</div>
    </div>

    <div id="3d-graph"></div>

    <div class="controls-hint">
        Scroll para Zoom • Click Izquierdo para Rotar • Click en Nodo para Enfoque
    </div>

    <script>
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(6)
            
            // --- FIX 2: ETIQUETAS PERMANENTES VISIBLES ---
            .nodeThreeObject(node => {
                const sprite = new SpriteText(node.name);
                sprite.color = '#ffffff';
                sprite.textHeight = 7; // Altura del texto
                sprite.padding = 3;
                sprite.backgroundColor = 'rgba(0, 0, 0, 0.6)'; // Fondo para legibilidad
                sprite.borderRadius = 2;
                return sprite;
            })
            .nodeThreeObjectExtend(true) // Muestra la esfera Y el texto
            
            .linkWidth(1.2)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .linkDirectionalParticleSpeed(0.005)
            .linkDirectionalParticleWidth(1.5)
            .showNavInfo(false);

        // --- CARGA DINÁMICA DE DATOS DESDE GITHUB ---
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                // Actualizar panel de estadísticas
                document.getElementById('stats').innerHTML = `
                    ESTADO: EN LÍNEA<br/>
                    LÍDERES IDENTIFICADOS: ${data.nodes.length}<br/>
                    NODOS DE CONEXIÓN: ${data.links.length}
                `;
                
                Graph.graphData(data);
                
                // Ajuste inicial de cámara
                Graph.zoomToFit(1000);
            })
            .catch(err => {
                console.error("Error al leer data.json:", err);
                document.getElementById('stats').innerHTML = "ERROR DE SINCRONIZACIÓN";
            });

        // --- FIX 1: CONTROL DE ZOOM Y ROTACIÓN INTELIGENTE ---
        const controls = Graph.controls();
        controls.enableZoom = true;
        
        let isUserInteracting = false;

        // Detectar si el usuario está manipulando el mapa
        controls.addEventListener('start', () => {
            isUserInteracting = true;
        });

        // Rotación automática suave (solo si el usuario no está tocando el mapa)
        let angle = 0;
        const distance = 1400;
        setInterval(() => {
            if (!isUserInteracting) {
                Graph.cameraPosition({
                    x: distance * Math.sin(angle),
                    z: distance * Math.cos(angle)
                });
                angle += Math.PI / 12000; // Velocidad de crucero lenta y elegante
            }
        }, 10);

        // Interacción: Vuelo de cámara al hacer clic en un líder
        Graph.onNodeClick(node => {
            isUserInteracting = true; // Detener rotación al enfocar
            const distance = 350;
            const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

            Graph.cameraPosition(
                { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, 
                node, 
                2500 
            );
        });

        // Botón derecho o doble click para retomar la rotación automática
        window.addEventListener('dblclick', () => {
            isUserInteracting = false;
        });
    </script>
</body>
</html>
