<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNE | Inteligencia 3D</title>

    <!-- THREE.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <!-- D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- 3D Force Graph -->
    <script src="https://unpkg.com/3d-force-graph@1.73.2/dist/3d-force-graph.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #00111f 0%, #00050a 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        #graph {
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0, 15, 30, 0.85);
            padding: 18px;
            border-left: 4px solid #66CC33;
            border-radius: 0 10px 10px 0;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(102, 204, 51, 0.2);
            pointer-events: none;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .stats {
            margin-top: 6px;
            color: #66CC33;
            font-size: 11px;
            font-family: monospace;
        }

        /* INFO PANEL */

        #infoPanel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 320px;
            min-height: 120px;

            background: rgba(0, 12, 24, 0.92);
            border: 1px solid rgba(102, 204, 51, 0.5);

            border-radius: 14px;
            padding: 20px;

            color: white;

            z-index: 200;

            backdrop-filter: blur(14px);

            box-shadow:
                0 0 30px rgba(102, 204, 51, 0.15),
                inset 0 0 25px rgba(102, 204, 51, 0.05);

            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        #infoPanel.active {
            opacity: 1;
            transform: translateY(0);
        }

        .info-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .info-line {
            margin-bottom: 10px;
            font-size: 15px;
            color: rgba(255,255,255,0.85);
        }

        .info-label {
            color: #66CC33;
            font-weight: 700;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <!-- LEFT PANEL -->
    <div id="ui">
        <div class="title">ESTRUCTURA UNE</div>
        <div id="status" class="stats">INICIALIZANDO SISTEMA...</div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="infoPanel">
        <div class="info-title">SELECCIONA UN NODO</div>
        <div class="info-line">
            Haz click sobre cualquier líder para ver información.
        </div>
    </div>

    <!-- GRAPH -->
    <div id="graph"></div>

    <script>

        const elem = document.getElementById('graph');
        const statusElem = document.getElementById('status');
        const infoPanel = document.getElementById('infoPanel');

        // =========================
        // GRAPH
        // =========================

        const Graph = ForceGraph3D()(elem)

            .backgroundColor('#00050a')

            // NODE COLOR
            .nodeColor(node => node.color || '#66CC33')

            // SMALLER NODES
            .nodeRelSize(5)

            // CUSTOM NODE + LABEL
            .nodeThreeObject(node => {

                const group = new THREE.Group();

                // =========================
                // GLOW NODE
                // =========================

                const geometry = new THREE.SphereGeometry(3.5, 24, 24);

                const material = new THREE.MeshStandardMaterial({
                    color: node.color || '#66CC33',
                    emissive: node.color || '#66CC33',
                    emissiveIntensity: 1.3,
                    metalness: 0.15,
                    roughness: 0.35
                });

                const sphere = new THREE.Mesh(geometry, material);

                group.add(sphere);

                // =========================
                // NAME LABEL ONLY
                // =========================

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const name = node.name || 'LÍDER';

                ctx.font = 'Bold 34px Arial';

                const textWidth = ctx.measureText(name).width;

                canvas.width = textWidth + 60;
                canvas.height = 70;

                // RESET AFTER RESIZE
                ctx.font = 'Bold 34px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Transparent futuristic background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Border glow
                ctx.strokeStyle = node.color || '#66CC33';
                ctx.lineWidth = 3;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                // Name
                ctx.fillStyle = '#ffffff';
                ctx.fillText(name, canvas.width / 2, 36);

                // TEXTURE
                const texture = new THREE.CanvasTexture(canvas);

                texture.minFilter = THREE.LinearFilter;

                const spriteMaterial = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthWrite: false
                });

                const sprite = new THREE.Sprite(spriteMaterial);

                // SMALLER LABELS
                sprite.scale.set(canvas.width / 26, canvas.height / 26, 1);

                // FLOAT ABOVE NODE
                sprite.position.set(0, 10, 0);

                group.add(sprite);

                return group;
            })

            // LINKS
            .linkWidth(1.4)
            .linkColor(() => '#ffffff')
            .linkOpacity(0.14)

            // PARTICLES
            .linkDirectionalParticles(2)
            .linkDirectionalParticleWidth(1.8)
            .linkDirectionalParticleSpeed(0.0035)

            // CLEAN UI
            .showNavInfo(false)

            // CLICK EVENT
            .onNodeClick(node => {

                infoPanel.classList.add('active');

                infoPanel.innerHTML = `
                    <div class="info-title">${node.name || 'SIN NOMBRE'}</div>

                    <div class="info-line">
                        <span class="info-label">ZONA:</span>
                        ${node.zona || 'NO DEFINIDA'}
                    </div>

                    <div class="info-line">
                        <span class="info-label">BARRIO:</span>
                        ${node.barrio || 'NO DEFINIDO'}
                    </div>
                `;

                // CAMERA FOCUS EFFECT
                const distance = 70;

                const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

                Graph.cameraPosition(
                    {
                        x: node.x * distRatio,
                        y: node.y * distRatio,
                        z: node.z * distRatio
                    },
                    node,
                    1200
                );
            });

        // =========================
        // LIGHTING
        // =========================

        const scene = Graph.scene();

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(100, 100, 100);
        scene.add(directionalLight);

        // =========================
        // MUCH MORE COMPACT GRAPH
        // =========================

        Graph.d3Force('charge')
            .strength(-110);

        Graph.d3Force('link')
            .distance(45);

        // =========================
        // ROTATION
        // =========================

        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.28;

        window.addEventListener('mousedown', () => {
            Graph.controls().autoRotate = false;
        });

        // =========================
        // LOAD DATA
        // =========================

        fetch('./data.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error('No se encontró data.json');
                }
                return res.json();
            })

            .then(data => {

                statusElem.innerText =
                    `LÍDERES: ${data.nodes.length} | CONEXIONES: ${data.links.length}`;

                Graph.graphData(data);

                setTimeout(() => {
                    Graph.zoomToFit(1200, 50);
                }, 1000);
            })

            .catch(err => {

                console.error(err);

                statusElem.innerText = 'ERROR CARGANDO DATA.JSON';
                statusElem.style.color = '#ff4444';
            });

    </script>

</body>
</html>
