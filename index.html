<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Mapa Estratégico Nacional</title>
    
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/three-spritetext"></script>
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 15, 30, 0.8); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(5px);
        }
        .subtitle { font-size: 18px; font-weight: bold; }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; }
        .hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.4); font-size: 10px; pointer-events: none; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="subtitle">ESTRUCTURA NACIONAL UNE</div>
        <div id="stats" class="stats">Sincronizando...</div>
    </div>

    <div id="3d-graph"></div>
    <div class="hint">Scroll para Zoom • Arrastrar para Rotar • Doble Click para Auto-Rotación</div>

    <script>
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            // --- NOMBRES FLOTANTES SIEMPRE VISIBLES ---
            .nodeThreeObject(node => {
                const sprite = new SpriteText(node.name);
                sprite.color = '#ffffff';
                sprite.textHeight = 6;
                sprite.padding = 2;
                sprite.backgroundColor = 'rgba(0,0,0,0.5)';
                sprite.borderRadius = 2;
                return sprite;
            })
            .nodeThreeObjectExtend(true)
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .linkDirectionalParticleSpeed(0.005);

        // --- SEPARACIÓN DE NODOS ---
        Graph.d3Force('charge').strength(-600);
        Graph.d3Force('link').distance(180);

        // --- CONTROL DE INTERACCIÓN ---
        let isRotating = true;
        const controls = Graph.controls();
        
        // Si el usuario interactúa, detenemos la rotación automática
        controls.addEventListener('start', () => { isRotating = false; });

        // Al hacer doble click, reiniciamos la rotación
        window.addEventListener('dblclick', () => { isRotating = true; });

        // Carga de datos
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('stats').innerText = `LÍDERES: ${data.nodes.length} | CONEXIONES: ${data.links.length}`;
                Graph.graphData(data);
                Graph.zoomToFit(1000);
            });

        // Lógica de rotación que NO bloquea el mouse
        let angle = 0;
        const distance = 1500;
        setInterval(() => {
            if (isRotating) {
                Graph.cameraPosition({
                    x: distance * Math.sin(angle),
                    z: distance * Math.cos(angle)
                });
                angle += Math.PI / 15000;
            }
        }, 10);
    </script>
</body>
</html>
