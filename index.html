<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA UNE | Inteligencia 3D</title>
    <script src="https://unpkg.com/3d-force-graph@1.73.2/dist/3d-force-graph.min.js"></script>
    <style>
        body { margin: 0; background: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(8px);
        }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-weight: 900; font-size: 18px;">ESTRUCTURA UNE</div>
        <div id="status" class="stats">SISTEMA INICIADO</div>
    </div>
    <div id="graph"></div>

    <script>
        const elem = document.getElementById('graph');

        const Graph = ForceGraph3D()(elem)
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            
            // --- DOCUMENTACIÓN OFICIAL: ETIQUETAS PERMANENTES SIN ERRORES ---
            .nodeThreeObject(node => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Texto a mostrar
                const name = node.name || "Líder";
                const barrio = node.barrio || ""; 
                
                // Configuración de resolución
                ctx.font = 'bold 36px Arial';
                const width = Math.max(ctx.measureText(name).width, ctx.measureText(barrio).width) + 40;
                canvas.width = width;
                canvas.height = 100;

                // Estilo de la placa
                ctx.fillStyle = 'rgba(0, 5, 15, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = node.color || '#66CC33';
                ctx.lineWidth = 4;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                // Dibujar Nombre
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(name, canvas.width / 2, 45);

                // Dibujar Barrio
                ctx.fillStyle = '#66CC33';
                ctx.font = '24px Arial';
                ctx.fillText(barrio, canvas.width / 2, 85);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(spriteMaterial);
                
                // Escala relativa al mundo 3D
                sprite.scale.set(width / 12, 8, 1);
                sprite.position.y = 12; // Flota sobre el nodo
                return sprite;
            })
            .nodeThreeObjectExtend(true)

            // --- FUERZAS SEGÚN DOCUMENTACIÓN D3-FORCE ---
            .d3Force('charge', d3.forceManyBody().strength(-150)) // Repulsión controlada
            .d3Force('link', d3.forceLink().distance(40))       // Distancia compacta
            
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .showNavInfo(false);

        // Rotación automática nativa
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.5;

        // CARGA ASÍNCRONA SEGURA
        fetch('./data.json')
            .then(res => {
                if (!res.ok) throw new Error("Error de red");
                return res.json();
            })
            .then(data => {
                document.getElementById('status').innerText = `LÍDERES: ${data.nodes.length} | BARRIOS: ACTIVOS`;
                Graph.graphData(data);
                
                // Zoom dinámico una vez cargado
                setTimeout(() => Graph.zoomToFit(800, 100), 500);
            })
            .catch(err => {
                document.getElementById('status').innerText = "ERROR CARGANDO DATOS JSON";
                console.error("Error crítico:", err);
            });

        // Evento para devolver control al usuario
        window.addEventListener('mousedown', () => { Graph.controls().autoRotate = false; });
    </script>
</body>
</html>
