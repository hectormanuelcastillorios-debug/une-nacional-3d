<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Inteligencia de Estructura Nacional</title>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { 
            margin: 0; 
            background-color: #00050a; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Capa de interfaz elegante */
        #ui-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: white;
            background: rgba(0, 10, 20, 0.7);
            padding: 20px;
            border-left: 5px solid #66CC33;
            backdrop-filter: blur(10px);
            pointer-events: none;
            box-shadow: 0 0 20px rgba(102, 204, 51, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 14px;
            letter-spacing: 4px;
            color: #66CC33;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .stats {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.8;
            color: #ffffff;
        }

        /* Estilo para las etiquetas de los nodos */
        .node-label {
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #66CC33;
            color: white;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>Sistema de Control Estratégico</h1>
        <div class="subtitle">UNE ESTRUCTURA NACIONAL</div>
        <div class="stats" id="stats">Cargando base de datos inteligente...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        // Inicialización del gráfico 3D
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a') // Azul espacial profundo
            .nodeLabel(node => `
                <div class="node-label">
                    <b>${node.name}</b><br/>
                    Zona: ${node.zona || 'N/A'}<br/>
                    Barrio: ${node.barrio || 'N/A'}
                </div>
            `)
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7) // Tamaño relativo de los nodos
            .nodeOpacity(0.9)
            .linkWidth(1.2)
            .linkOpacity(0.3)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(3) // Pequeñas luces que viajan
            .linkDirectionalParticleSpeed(0.006)
            .linkDirectionalParticleWidth(2)
            .showNavInfo(false); // Ocultar info de navegación para un look más limpio

        // FUNCIÓN CLAVE: Cargar los datos desde el archivo generado por n8n
        fetch('./data.json')
            .then(res => {
                if (!res.ok) throw new Error("Archivo data.json no encontrado");
                return res.json();
            })
            .then(data => {
                // Actualizar estadísticas en pantalla
                document.getElementById('stats').innerHTML = `
                    ESTRUCTURA ACTIVA: ${data.nodes.length} LÍDERES<br/>
                    CONEXIONES REGISTRADAS: ${data.links.length}
                `;
                
                // Cargar los datos al motor 3D
                Graph.graphData(data);
                
                // Ajustar la cámara para ver todo el mapa
                Graph.zoomToFit(1000);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('stats').innerText = "ERROR AL SINCRONIZAR CON GITHUB";
            });

        // EFECTO "CINEMATOGRÁFICO": Rotación suave de la cámara
        let angle = 0;
        const distance = 1200;
        setInterval(() => {
            Graph.cameraPosition({
                x: distance * Math.sin(angle),
                z: distance * Math.cos(angle)
            });
            angle += Math.PI / 8000; // Velocidad de la rotación
        }, 10);

        // Interactividad: Al hacer click en un nodo, la cámara se acerca
        Graph.onNodeClick(node => {
            const distance = 300;
            const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

            Graph.cameraPosition(
                { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, // nueva posición
                node, // mirar hacia el nodo
                3000  // duración de la transición (ms)
            );
        });
    </script>
</body>
</html>
