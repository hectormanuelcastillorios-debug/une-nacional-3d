<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Control Nacional</title>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100; color: white;
            background: rgba(0, 10, 20, 0.8); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; border-radius: 0 5px 5px 0;
        }
        .subtitle { font-size: 18px; font-weight: bold; color: #ffffff; letter-spacing: 1px; }
        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; text-transform: uppercase; }
        /* Estilo de la etiqueta que sale al pasar el mouse */
        .scene-tooltip {
            color: #66CC33 !important;
            background: rgba(0, 0, 0, 0.9) !important;
            border: 1px solid #66CC33 !important;
            border-radius: 4px !important;
            padding: 8px !important;
            font-family: monospace !important;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="subtitle">ESTRUCTURA NACIONAL UNE</div>
        <div id="stats" class="stats">Sincronizando...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            // --- SOLUCIÓN A LOS NOMBRES (TOOLTIP) ---
            .nodeLabel(node => `
                <div style="text-align: center;">
                    <b style="font-size: 14px;">${node.name}</b><br/>
                    <span style="color: #fff; opacity: 0.8;">ZONA: ${node.zona || 'N/A'}</span>
                </div>
            `)
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .linkDirectionalParticleSpeed(0.005)
            .showNavInfo(true); // Esto mostrará los controles abajo a la izquierda

        // --- FORZAR ZOOM Y CONTROLES ---
        const controls = Graph.controls();
        controls.enableZoom = true;
        controls.autoRotate = false; // Desactivamos rotación automática interna para no bloquear zoom

        // Carga de datos
        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('stats').innerHTML = `LÍDERES: ${data.nodes.length} | CONEXIONES: ${data.links.length}`;
                Graph.graphData(data);
            })
            .catch(err => {
                console.error("Error:", err);
                document.getElementById('stats').innerText = "ERROR DE DATOS";
            });

        // --- ROTACIÓN AUTOMÁTICA EXTERNA (NO BLOQUEANTE) ---
        let angle = 0;
        const distance = 1400;
        let activeRotation = true;

        // Si el usuario usa la rueda del mouse, detenemos la rotación para que pueda navegar
        window.addEventListener('wheel', () => { activeRotation = false; });
        window.addEventListener('mousedown', () => { activeRotation = false; });
        
        // Para retomar la rotación, doble click
        window.addEventListener('dblclick', () => { activeRotation = true; });

        setInterval(() => {
            if (activeRotation) {
                Graph.cameraPosition({
                    x: distance * Math.sin(angle),
                    z: distance * Math.cos(angle)
                });
                angle += Math.PI / 15000;
            }
        }, 10);
    </script>
</body>
</html>
