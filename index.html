<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Estructura 3D Nacional</title>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000; color: white;
            background: rgba(0, 10, 20, 0.85); padding: 15px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(10px); border-radius: 0 5px 5px 0;
        }

        /* ESTILO DE LAS ETIQUETAS QUE SÍ FUNCIONAN */
        .node-label {
            font-size: 10px;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(102, 204, 51, 0.5);
            color: white;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
        }

        .hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.3); font-size: 9px; letter-spacing: 2px;
            pointer-events: none; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-size: 11px; color: #66CC33; letter-spacing: 2px;">INTELIGENCIA ESTRATÉGICA</div>
        <div style="font-size: 20px; font-weight: bold;">RED NACIONAL UNE</div>
        <div id="stats" style="font-size: 11px; margin-top: 5px; opacity: 0.8;">Iniciando nodos...</div>
    </div>

    <div id="3d-graph"></div>
    <div class="hint">Scroll: Zoom • Arrastrar: Rotar • Click: Enfocar</div>

    <script>
        const Graph = ForceGraph3D({ extraRenderers: [new THREE.CSS2DRenderer()] })(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(2)
            .linkDirectionalParticleSpeed(0.005)
            
            // --- EL TRUCO PARA LOS NOMBRES: HTML puro sobre 3D ---
            .nodeThreeObject(node => {
                const div = document.createElement('div');
                div.textContent = node.name;
                div.className = 'node-label';
                return new THREE.CSS2DObject(div);
            })
            .nodeThreeObjectExtend(true)

            // --- SEPARACIÓN MÁXIMA ---
            .d3Force('charge', d3.forceManyBody().strength(-500))
            .d3Force('link', d3.forceLink().distance(150))
            
            .showNavInfo(false);

        // --- GESTIÓN DE ROTACIÓN Y ZOOM ---
        let autoRotate = true;
        const controls = Graph.controls();
        
        // Si el usuario toca el mapa, la rotación se detiene para siempre (o hasta refrescar)
        controls.addEventListener('start', () => { autoRotate = false; });

        fetch('./data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('stats').innerText = `LÍDERES: ${data.nodes.length} | CONEXIONES: ${data.links.length}`;
                Graph.graphData(data);
                Graph.zoomToFit(1000);
            })
            .catch(err => {
                document.getElementById('stats').innerText = "ERROR DE CARGA";
            });

        // Animación de rotación suave
        let angle = 0;
        (function animate() {
            if (autoRotate) {
                Graph.cameraPosition({
                    x: 1400 * Math.sin(angle),
                    z: 1400 * Math.cos(angle)
                });
                angle += Math.PI / 12000;
            }
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
