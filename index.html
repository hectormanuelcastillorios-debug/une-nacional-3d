<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Sistema de Inteligencia 3D</title>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #ui-panel {
            position: absolute; top: 25px; left: 25px; z-index: 1000; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 20px; border-left: 4px solid #66CC33;
            pointer-events: none; backdrop-filter: blur(10px); box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }

        .stats { font-size: 11px; color: #66CC33; margin-top: 8px; font-family: monospace; text-transform: uppercase; }
        
        /* Hint de controles */
        .controls-hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 1px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-size: 12px; letter-spacing: 2px; opacity: 0.8;">RED ESTRATÉGICA</div>
        <div style="font-size: 22px; font-weight: 900;">ESTRUCTURA UNE</div>
        <div id="stats" class="stats">Sincronizando base de datos...</div>
    </div>

    <div id="3d-graph"></div>
    <div class="controls-hint">SCROLL: ZOOM • ARRASTRAR: ROTAR • CLICK: ENFOCAR LÍDER</div>

    <script>
        // Inicialización segura del Grafo
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#00050a')
            .nodeColor(node => node.color || '#66CC33')
            .nodeRelSize(7)
            .linkWidth(1.5)
            .linkOpacity(0.2)
            .linkColor(() => '#ffffff')
            .linkDirectionalParticles(3)
            .linkDirectionalParticleSpeed(0.005)
            
            // --- SOLUCIÓN DEFINITIVA PARA NOMBRES (Canvas Sprite) ---
            .nodeThreeObject(node => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const label = node.name;
                ctx.font = '24px Sans-Serif';
                const textWidth = ctx.measureText(label).width;
                
                canvas.width = textWidth + 10;
                canvas.height = 30;
                
                // Fondo de la etiqueta
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Texto
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(12 * (canvas.width / canvas.height), 12, 1);
                sprite.position.y = 12; // Eleva el nombre sobre la esfera
                return sprite;
            })
            .nodeThreeObjectExtend(true)

            // --- CONFIGURACIÓN DE SEPARACIÓN Y ZOOM ---
            .showNavInfo(false);

        // Ajustar fuerzas de separación (D3 interno)
        Graph.d3Force('charge').strength(-800); // Repulsión fuerte
        Graph.d3Force('link').distance(180);   // Enlaces largos

        // Habilitar controles manuales
        Graph.controls().enableZoom = true;
        Graph.controls().enableRotate = true;

        // Carga de datos desde GitHub/n8n
        fetch('./data.json')
            .then(res => {
                if (!res.ok) throw new Error("Error cargando data.json");
                return res.json();
            })
            .then(data => {
                document.getElementById('stats').innerText = `LÍDERES: ${data.nodes.length} | ESTADO: ACTIVO`;
                Graph.graphData(data);
                
                // Ajuste de cámara inicial
                setTimeout(() => { Graph.zoomToFit(1000, 300); }, 500);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('stats').innerText = "ERROR: VERIFICA EL REPOSITORIO";
                document.getElementById('stats').style.color = "#ff4444";
            });

        // --- ROTACIÓN AUTOMÁTICA INTELIGENTE ---
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.5;

        // Si el usuario toca el mapa, la rotación se detiene para permitir control total
        window.addEventListener('mousedown', () => {
            Graph.controls().autoRotate = false;
        });

        // Zoom suave al hacer click en un nodo
        Graph.onNodeClick(node => {
            const distance = 300;
            const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
            Graph.cameraPosition(
                { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                node,
                2000
            );
        });
    </script>
</body>
</html>
