<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNE | Red Nacional 3D</title>
    
    <script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #00050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000; color: white;
            background: rgba(0, 15, 30, 0.9); padding: 20px; border-left: 4px solid #66CC33;
            pointer-events: none; border-radius: 0 8px 8px 0;
        }

        .stats { font-size: 11px; color: #66CC33; margin-top: 5px; font-family: monospace; }

        /* Estilo para los nombres al pasar el mouse */
        .scene-tooltip {
            background: rgba(0, 0, 0, 0.9) !important;
            border: 1px solid #66CC33 !important;
            color: #fff !important;
            border-radius: 4px !important;
            padding: 10px !important;
            font-size: 14px !important;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-size: 22px; font-weight: bold;">ESTRUCTURA UNE</div>
        <div id="status" class="stats">INICIALIZANDO SISTEMA...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        // Esperamos a que la página cargue totalmente
        window.onload = function() {
            const statusElem = document.getElementById('status');

            // 1. Inicializar el Grafo con configuración base estable
            const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
                .backgroundColor('#00050a')
                .nodeColor(node => node.color || '#66CC33')
                .nodeRelSize(7)
                // NOMBRES: Aparecen en un cuadro profesional al tocar o pasar el mouse
                .nodeLabel(node => `
                    <div style="padding: 5px;">
                        <b style="color: #66CC33; font-size: 16px;">${node.name}</b><br/>
                        <span style="opacity: 0.8;">Zona: ${node.zona || 'Nacional'}</span>
                    </div>
                `)
                .linkWidth(1.5)
                .linkColor(() => '#ffffff')
                .linkOpacity(0.2)
                .linkDirectionalParticles(3)
                .linkDirectionalParticleSpeed(0.005)
                .showNavInfo(false);

            // 2. CONFIGURAR SEPARACIÓN (Evita que se amontonen)
            Graph.d3Force('charge').strength(-1000); // Repulsión fuerte
            Graph.d3Force('link').distance(150);    // Enlaces largos

            // 3. CARGAR DATOS
            fetch('./data.json')
                .then(res => {
                    if (!res.ok) throw new Error("No se encontró data.json");
                    return res.json();
                })
                .then(data => {
                    statusElem.innerText = `LÍDERES: ${data.nodes.length} | CONEXIONES: ${data.links.length}`;
                    Graph.graphData(data);
                    
                    // Ajuste de cámara para ver todo el mapa
                    setTimeout(() => Graph.zoomToFit(1000, 200), 500);
                })
                .catch(err => {
                    statusElem.innerText = "ERROR: VERIFICA EL ARCHIVO DATA.JSON";
                    statusElem.style.color = "#ff4444";
                    console.error(err);
                });

            // 4. CONTROL DE ROTACIÓN Y ZOOM
            // La rotación es nativa del motor para no bloquear el mouse
            Graph.controls().autoRotate = true;
            Graph.controls().autoRotateSpeed = 0.6;

            // Si el usuario hace click o usa el mouse, la rotación se detiene para darle el control
            document.addEventListener('mousedown', () => {
                Graph.controls().autoRotate = false;
            });
        };
    </script>
</body>
</html>
